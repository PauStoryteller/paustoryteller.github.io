<footer class="site-footer">
  <div class="footer-constellation" aria-hidden="true">
    <svg viewBox="0 0 300 30" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" y1="18" x2="60" y2="6" class="fc-line fc-line-a" />
      <line x1="60" y1="6" x2="130" y2="22" class="fc-line fc-line-b" />
      <line x1="130" y1="22" x2="190" y2="4" class="fc-line fc-line-c" />
      <line x1="190" y1="4" x2="250" y2="16" class="fc-line fc-line-b" />
      <line x1="250" y1="16" x2="300" y2="8" class="fc-line fc-line-a" />
      <circle cx="0" cy="18" r="1.6" class="fc-dot fc-dot-2" />
      <circle cx="60" cy="6" r="2" class="fc-dot fc-dot-1" />
      <circle cx="130" cy="22" r="1.5" class="fc-dot fc-dot-3" />
      <circle cx="190" cy="4" r="1.9" class="fc-dot fc-dot-2" />
      <circle cx="250" cy="16" r="1.5" class="fc-dot fc-dot-1" />
      <circle cx="300" cy="8" r="1.7" class="fc-dot fc-dot-3" />
    </svg>
  </div>

  <div class="container footer-inner">
    <div class="footer-brand">
      <img class="footer-logo-icon" width="22" height="22" alt="" src="{{ '/images/logo/icon.png' | relative_url }}" />
      <span class="footer-wordmark">Pau<span class="footer-wordmark-accent">Storyteller</span></span>
    </div>

    {% include social.html %}

    {% if site.data.seo.copyright_text %}
    <div class="footer-copyright">{{ site.data.seo.copyright_text }}</div>
    {% endif %}
  </div>
</footer>
