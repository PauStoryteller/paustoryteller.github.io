<div class='header'>
  <div class="container">
    <div class="logo">
      {% assign home_url = "/" %}
      {% if page.lang == "en" %}{% assign home_url = "/en/" %}{% endif %}
      <a href="{{ home_url | relative_url }}" class="logo-link" aria-label="{{ site.title }}">
        <img class="logo-icon" width="36" height="36" alt="" src="{{ '/images/logo/icon.png' | relative_url }}" />
        <span class="logo-wordmark">Pau<span class="logo-wordmark-accent">Storyteller</span></span>
      </a>
    </div>
    <div class="header-constellation" aria-hidden="true">
      <svg viewBox="0 0 130 40" width="130" height="40" xmlns="http://www.w3.org/2000/svg">
        <line x1="8" y1="30" x2="52" y2="11" class="hc-line hc-line-a" />
        <line x1="52" y1="11" x2="96" y2="25" class="hc-line hc-line-b" />
        <line x1="96" y1="25" x2="120" y2="9" class="hc-line hc-line-c" />
        <circle cx="8" cy="30" r="2.1" class="hc-dot hc-dot-1" />
        <circle cx="52" cy="11" r="1.6" class="hc-dot hc-dot-2" />
        <circle cx="96" cy="25" r="1.9" class="hc-dot hc-dot-3" />
        <circle cx="120" cy="9" r="1.4" class="hc-dot hc-dot-4" />
      </svg>
    </div>
    {% include main-menu.html %}
    {% include hamburger.html %}
  </div>
</div>
