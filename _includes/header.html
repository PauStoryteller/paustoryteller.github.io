<div class='header'>
  <div class="container">
    <div class="logo">
      {% assign home_url = "/" %}
      {% if page.lang == "en" %}{% assign home_url = "/en/" %}{% endif %}
      <a href="{{ home_url | relative_url }}" class="logo-link" aria-label="{{ site.title }}">
        <img class="logo-icon" width="36" height="36" alt="" src="{{ '/images/logo/icon.png' | relative_url }}" />
        <span class="logo-wordmark">Pau<span class="logo-wordmark-accent">Storyteller</span></span>
      </a>
    </div>
    {% include main-menu.html %}
    {% include hamburger.html %}
  </div>
</div>
