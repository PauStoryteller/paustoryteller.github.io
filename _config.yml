baseurl: ''
url: 'https://paustoryteller.com'
permalink: pretty
title: 'Pau Storyteller'
description: 'Portfolio y blog personal de Pau — proyectos, escritura y trabajo creativo.'

# jekyll-sitemap está en la lista de plugins que GitHub Pages soporta de forma
# nativa (sin necesitar GitHub Actions). Genera automáticamente /sitemap.xml,
# que ayuda a Google a encontrar e indexar todas las páginas del sitio.
plugins:
  - jekyll-sitemap

home:
  limit_featured: 3

collections:
  portfolio:
    output: true
    permalink: /portfolio/:path/
  journal:
    output: true
    permalink: /journal/:path/
  portfolio_en:
    output: true
    permalink: /en/portfolio/:path/
  journal_en:
    output: true
    permalink: /en/journal/:path/

defaults:
  - scope:
      path: ""
    values:
      lang: "es"
  - scope:
      path: "en"
    values:
      lang: "en"
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "piece-single"
  - scope:
      path: ""
      type: "journal"
    values:
      layout: "piece-single"
  - scope:
      path: ""
      type: "portfolio_en"
    values:
      layout: "piece-single"
      lang: "en"
  - scope:
      path: ""
      type: "journal_en"
    values:
      layout: "piece-single"
      lang: "en"

sass:
  style: compressed # possible values: nested expanded compact compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
  - GUIA.md
