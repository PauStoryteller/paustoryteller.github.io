baseurl: ''
url: 'https://paustoryteller.github.io'
permalink: pretty
title: 'Pau Storyteller'
description: 'Portfolio y blog personal de Pau — proyectos, escritura y trabajo creativo.'

home:
  limit_updates: 6

collections:
  updates:
    output: true
    sort_by: date

defaults:
  - scope:
      path: ""
      type: "updates"
    values:
      layout: "update-single"

sass:
  style: compressed # possible values: nested expanded compact compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
  - GUIA.md
